name: sheets-test

# Tests Chargesheets end to end with real free models: MangoMan serving with
# the repo's keys, five made-up files loaded through the page's API,
# questions with known answers (scripts/sheets-test.py) and a public Google
# Sheet link. About 100 free-tier requests. Run it by hand, never on a
# schedule. The report goes to the eval-reports branch.
# A session starts it with POST /repos/<owner>/<repo>/dispatches, event_type sheets-test.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sheets-test]

permissions:
  contents: write # only to publish the report to the eval-reports branch

concurrency:
  group: sheets-test
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MANGOMAN_KEYSTORE: file
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start MangoMan
        run: |
          pip install openpyxl
          export MANGOMAN_HOME="$RUNNER_TEMP/mangoman"
          echo "MANGOMAN_HOME=$MANGOMAN_HOME" >> "$GITHUB_ENV"
          go build -o mm ./cmd/mangoman
          ./mm init > /dev/null
          python3 -c "import json,os;p=os.environ['MANGOMAN_HOME']+'/config.json';c=json.load(open(p));c['port']=4199;json.dump(c,open(p,'w'))"
          nohup ./mm serve > serve.log 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:4199/healthz && break; sleep 1; done
      - name: Run the test
        timeout-minutes: 40
        run: python3 scripts/sheets-test.py 2>&1 | tee run.log
      - name: Publish the report to the eval-reports branch
        if: always()
        run: |
          [ -s report.md ] || exit 0
          mkdir out && mv report.md out/ && cp serve.log run.log out/ 2>/dev/null; python3 scripts/mask-keys.py out
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          stamp=$(date -u +%Y%m%d-%H%M%S)
          git config user.name "mangoman-eval"
          git config user.email "eval@users.noreply.github.com"
          git fetch origin +refs/heads/eval-reports:refs/remotes/origin/eval-reports
          git worktree add ../reports origin/eval-reports
          cd ../reports
          git switch -C eval-reports
          mkdir -p "reports/sheets-test/$stamp"
          cp "$GITHUB_WORKSPACE"/out/* "reports/sheets-test/$stamp/"
          git add -A
          git commit -q -m "sheets test $stamp (run ${{ github.run_id }})" || exit 0
          git push origin eval-reports
