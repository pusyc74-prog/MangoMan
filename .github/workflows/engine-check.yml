name: engine-check

# MangoMan on OpenCode's own free models (the default engine, no setting),
# against the real service: a small task, a question (as Chargesheets and
# Guardian ask) and a council must work with no request through MangoMan's
# switch; then, once the runner's free allowance is used up, each must stop
# at once with MangoMan's own message. Spends only
# OpenCode's free allowance for the runner's address. Run by hand, or by
# pushing the branch check-engine; the report goes to eval-reports.

on:
  push:
    branches: [check-engine]
  workflow_dispatch:

permissions:
  contents: write # only to publish the report to the eval-reports branch

concurrency:
  group: engine-check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install MangoMan and the OpenCode release it ships
        run: |
          v=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/opencode/opencode.go)
          npm install -g "opencode-ai@$v"
          go build -o "$RUNNER_TEMP/mangoman" ./cmd/mangoman
          export MANGOMAN_HOME="$RUNNER_TEMP/home"
          echo "MANGOMAN_HOME=$MANGOMAN_HOME" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/mangoman" init > /dev/null
          "$RUNNER_TEMP/mangoman" engine
          nohup "$RUNNER_TEMP/mangoman" serve > "$RUNNER_TEMP/serve.log" 2>&1 &
          sleep 3
      - name: Check
        run: |
          set +e
          mm="$RUNNER_TEMP/mangoman"
          task="Create hello.py that prints Hello from MangoMan. Then run it with python3 to check it."
          r=engine.md
          say() { echo "$1" | tee -a "$r"; }
          say "# MangoMan on OpenCode's own free models"
          say ""
          say "$(date -u '+%d %b %H:%M UTC'), OpenCode $(opencode --version), engine $("$mm" engine), no provider keys."
          say ""
          say "## 1. A small task"
          say ""
          mkdir one && cd one
          start=$(date +%s)
          timeout 900 "$mm" code --no-web run --auto "$task" > ../one.log 2>&1
          code=$? took=$(( $(date +%s) - start ))
          out=$(python3 hello.py 2>&1)
          cd ..
          via=$(grep -c "req=" "$RUNNER_TEMP/serve.log")
          say "- Exit $code after ${took}s."
          if [ "$out" = "Hello from MangoMan" ]; then say "- PASS: hello.py made and prints the greeting."; else say "- FAIL: hello.py prints: ${out:0:200}"; fi
          if [ "$via" = 0 ]; then say "- PASS: no request went through MangoMan's switch."; else say "- FAIL: $via requests went through MangoMan's switch."; fi
          if grep -q "free AI messages are used up" one.log; then say "- NOTE: the runner's free allowance ran out during the task (its address was already partly used)."; fi
          say ""
          say "## 1b. A question (as Chargesheets and Guardian ask) and a council"
          say ""
          # The same run as MangoMan's Ask, with OpenCode's own log kept: which
          # model it used and what the service said.
          cfg='{"enabled_providers":["opencode"],"share":"disabled","autoupdate":false,"agent":{"title":{"disable":true},"mangoman-ask":{"mode":"primary","description":"Answers one request for MangoMan","prompt":"You answer one request from MangoMan, in one reply. Use no tools.","permission":{"*":"deny"}}}}'
          (mkdir -p ask-diag && cd ask-diag && echo "Reply with the single word OK." | OPENCODE_CONFIG_CONTENT="$cfg" timeout 120 opencode run --format json --agent mangoman-ask --print-logs --log-level INFO > ../ask-diag.out 2> ../ask-diag.log)
          say "- Diagnosis: OpenCode's free models here: $(opencode models opencode 2>/dev/null | tr '\n' ' ')"
          say "- Diagnosis: recent model file: $(cat ~/.local/state/opencode/model.json 2>/dev/null | tr -d '\n' | cut -c1-200)"
          say "- Diagnosis: models the Ask run used: $(grep -o 'modelID=[^ ]*' ask-diag.log | sort | uniq -c | tr '\n' ' ')"
          say "- Diagnosis: its errors: $(grep 'level=ERROR' ask-diag.log | grep -o 'error.error=.*' | cut -c1-200 | sort -u | head -3 | tr '\n' ' ')"
          say "- Diagnosis: its answer: $(grep -o '"text":"[^"]*"' ask-diag.out | head -1 | cut -c1-120)"
          { echo "<details><summary>OpenCode's log for that run (last 25 lines)</summary>"; echo; echo '```'; tail -25 ask-diag.log | cut -c1-400; echo '```'; echo "</details>"; echo; } >> "$r"
          ans=$(timeout 300 "$mm" test "Reply with the single word OK." 2>&1)
          if echo "$ans" | grep -q "OpenCode's own free models" && echo "$ans" | grep -qi "ok"; then say "- PASS: the question was answered: $(echo "$ans" | tail -1 | cut -c1-120)"; else say "- FAIL: the question: $(echo "$ans" | tail -3 | tr '\n' ' ' | cut -c1-300)"; fi
          export MANGOMAN_OPENCODE=$(command -v opencode)
          P=internal/skills/packs/mangoman-council/scripts
          timeout 600 python3 $P/council.py internal/skills/testdata/council/question.md --rounds 1 --out council-one > council-one.log 2>&1
          answered=$(python3 -c "import json;r=json.load(open('council-one/council.json'));print(sum(v['rounds'][0]['ok'] for v in r['voices']), [v['model'] for v in r['voices']])" 2>&1)
          if [ "${answered%% *}" -ge 2 ] 2>/dev/null; then say "- PASS: a council of OpenCode's free models answered: $answered"; else say "- FAIL: the council: $answered $(tail -2 council-one.log | tr '\n' ' ' | cut -c1-300)"; fi
          via=$(grep -c "req=" "$RUNNER_TEMP/serve.log")
          if [ "$via" = 0 ]; then say "- PASS: still no request through MangoMan's switch."; else say "- FAIL: $via requests went through MangoMan's switch."; fi
          say ""
          say "## 2. The runner's free allowance used up"
          say ""
          mkdir zen && (cd zen && python3 ../scripts/zen-limit.py "" 400 4 > ../zen.log 2>&1)
          say "$(grep -m1 'Messages answered before the limit' zen/report.md)"
          say ""
          say "## 3. The same task at the limit"
          say ""
          mkdir three && cd three
          start=$(date +%s)
          timeout 300 "$mm" code --no-web run --auto "$task" > ../three.log 2>&1
          code=$? took=$(( $(date +%s) - start ))
          cd ..
          say "- Exit $code after ${took}s."
          if grep -q "free AI messages are used up" three.log && [ "$took" -lt 120 ]; then say "- PASS: stopped quickly with MangoMan's message: $(grep -m1 'free AI messages' three.log)"; else say "- FAIL: no quick stop with MangoMan's message."; fi
          if grep -qi "subscribe to Go" three.log; then say "- FAIL: OpenCode's Go advert reached the output."; else say "- PASS: no OpenCode Go advert in the output."; fi
          start=$(date +%s); ans=$(timeout 300 "$mm" test "Reply with OK." 2>&1); took=$(( $(date +%s) - start ))
          if echo "$ans" | grep -q "free AI messages are used up" && [ "$took" -lt 60 ]; then say "- PASS: the question stopped in ${took}s with MangoMan's message."; else say "- FAIL: the question at the limit (${took}s): $(echo "$ans" | tail -2 | tr '\n' ' ' | cut -c1-300)"; fi
          start=$(date +%s); timeout 600 python3 $P/council.py internal/skills/testdata/council/question.md --rounds 1 --out council-limit > council-limit.log 2>&1; took=$(( $(date +%s) - start ))
          if grep -q "free AI messages are used up" council-limit.log && [ "$took" -lt 120 ]; then say "- PASS: the council stopped in ${took}s with MangoMan's message."; else say "- FAIL: the council at the limit (${took}s): $(tail -2 council-limit.log | tr '\n' ' ' | cut -c1-300)"; fi
          for f in one three; do say ""; say "<details><summary>Output of task $f (last 40 lines)</summary>"; say ""; say '```'; tail -40 "$f.log" | cut -c1-300 | tee -a "$r" > /dev/null; say '```'; say "</details>"; done
          exit 0
      - name: Publish the report to the eval-reports branch
        if: always()
        run: |
          [ -s engine.md ] || exit 0
          cat engine.md >> "$GITHUB_STEP_SUMMARY"
          stamp=$(date -u +%Y%m%d-%H%M%S)
          git config user.name "mangoman-eval"
          git config user.email "eval@users.noreply.github.com"
          git fetch origin +refs/heads/eval-reports:refs/remotes/origin/eval-reports
          git worktree add ../reports origin/eval-reports
          cd ../reports
          git switch -C eval-reports
          mkdir -p reports/engine-check
          cp "$GITHUB_WORKSPACE/engine.md" "reports/engine-check/$stamp.md"
          git add -A
          git commit -q -m "engine check $stamp (run ${{ github.run_id }})" || exit 0
          git push origin eval-reports
