name: ci

# The repo is private, so GitHub Actions minutes are counted (2,000 a month
# free; macOS counts 10 times, Windows twice). Every push gets one Linux job;
# the pack samples run only when packs change (packs.yml); macOS, Windows and
# the cross-builds run once a week and on demand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 20 * * 0" # Sundays 01:45 IST: macOS, Windows and the builds

permissions:
  contents: read

concurrency:
  # A newer push makes the older run pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Vet, tests with the race detector, and the lean check in one job, so a
    # push costs one runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: |
          go mod tidy
          git diff --quiet go.mod go.sum || echo "::warning::go.mod or go.sum changed after go mod tidy; commit them"
          git checkout go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          set +e
          go test -race -count=1 ./... 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            { grep -E -B2 -A12 -- "--- FAIL|panic:|^FAIL|cannot|undefined" test.log || tail -40 test.log; } | tail -c 3500 > fail.txt
            echo "::error::$(awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}' fail.txt)"
          fi
          exit $status
      - name: Lean check (dead code, assignments that never take effect)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          args: --no-config --default=none -E unused,ineffassign ./...

  other-systems:
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...

  build:
    # All five targets in one job.
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/}; ext=""; [ "$GOOS" = windows ] && ext=".exe"
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/mangoman-$GOOS-$GOARCH$ext ./cmd/mangoman
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mangoman
          path: dist/
