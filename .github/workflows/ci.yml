name: ci

# The repo is private, so GitHub Actions minutes are counted (2,000 a month
# free; macOS counts 10 times, Windows twice). Every push gets one Linux job;
# the pack samples run only when packs change (packs.yml); macOS, Windows and
# the cross-builds run once a week and on demand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # POST /repos/<owner>/<repo>/dispatches with event_type ci.
  repository_dispatch:
    types: [ci]
  schedule:
    - cron: "15 20 * * 0" # Sundays 01:45 IST: macOS, Windows and the builds

permissions:
  contents: read

concurrency:
  # A newer push makes the older run pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Vet, tests with the race detector, and the lean check in one job, so a
    # push costs one runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: |
          go mod tidy
          git diff --quiet go.mod go.sum || echo "::warning::go.mod or go.sum changed after go mod tidy; commit them"
          git checkout go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          set +e
          go test -race -count=1 ./... 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            { grep -E -B2 -A12 -- "--- FAIL|panic:|^FAIL|cannot|undefined" test.log || tail -40 test.log; } | tail -c 3500 > fail.txt
            echo "::error::$(awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}' fail.txt)"
          fi
          exit $status
      - name: Lean check (dead code, assignments that never take effect)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          args: --no-config --default=none -E unused,ineffassign ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mango Arch server (the Worker on a real SQLite database)
        run: node server/arch/test.mjs

  other-systems:
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false # one system failing should not hide the other's result
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        shell: bash
        run: |
          set +e
          go test -count=1 ./... 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            { grep -E -B2 -A12 -- "--- FAIL|panic:|^FAIL|cannot|undefined" test.log || tail -40 test.log; } | tail -c 3500 > fail.txt
            echo "::error::$(awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}' fail.txt)"
          fi
          exit $status

  build:
    # All five systems in one job. The artifact is the download site, ready
    # to drop on Netlify.
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to publish the release "latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the download site (every system, the page and the install scripts)
        env: # Mango Arch's address and public key (repository variables); empty = off
          ARCH_URL: ${{ vars.ARCH_URL }}
          ARCH_KEY: ${{ vars.ARCH_KEY }}
        run: scripts/make-site.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mangoman
          path: dist/site/
      # The same build as the GitHub release "latest", so there are direct
      # download links without a manual upload: the install lines fetch
      # from the release.
      - name: Publish the release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH_URL: ${{ vars.ARCH_URL }}
          ARCH_KEY: ${{ vars.ARCH_KEY }}
        run: |
          OUT=dist/release scripts/make-site.sh "https://github.com/${{ github.repository }}/releases/download/latest"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/release/* --prerelease --target "$GITHUB_SHA" --title "MangoMan (latest build)" \
            --notes "Built from $(git rev-parse --short HEAD). Windows: [Net.ServicePointManager]::SecurityProtocol=3072; irm https://github.com/${{ github.repository }}/releases/download/latest/install.ps1 | iex  Mac or Linux: curl -fsSL https://github.com/${{ github.repository }}/releases/download/latest/install.sh | sh"
