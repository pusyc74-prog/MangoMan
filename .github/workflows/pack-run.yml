name: pack-run

# Runs the skill packs on their own test cases with real free models, scores
# every case and records how many requests and tokens each task cost. This is
# the measurement behind "how many tasks does a free user get in a day".
#
# Needs at least one provider key in this repo's secrets (NVIDIA_API_KEY is the
# one with room for this). Run it from the Actions tab or by dispatch. It is
# never scheduled and never runs on a push: each run uses real free-tier
# requests and, in the private repo, about an hour of Actions minutes, so use
# the self-hosted runner (runner: self-hosted) when it is set up.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "model for OpenCode (free/coder, free/auto, strict/<model>)"
        default: free/coder
      packs:
        description: "pack folder names, separated by spaces or commas (empty = all with cases)"
        required: false
        default: ""
      variant:
        description: "instruction style to test instead of SKILL.md (e.g. ste)"
        required: false
        default: ""
      cases:
        description: "cases per pack (empty = all three; 1 is a cheap smoke run)"
        required: false
        default: ""
      case_timeout:
        description: "seconds one case may take before it is cut (default 900)"
        required: false
        default: ""
      runner:
        description: "where to run: ubuntu-latest, or self-hosted (the owner's computer, once the repo is private)"
        required: false
        default: ubuntu-latest
  # Lets a session start a run without the Actions page, which it cannot
  # reach: POST /repos/<owner>/<repo>/dispatches with event_type pack-run and
  # any of model, packs, variant, cases, case_timeout, runner in client_payload.
  repository_dispatch:
    types: [pack-run]

permissions:
  contents: write # only to publish the report to the eval-reports branch

concurrency:
  group: pack-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ${{ inputs.runner || github.event.client_payload.runner || 'ubuntu-latest' }}
    timeout-minutes: 180
    env:
      MANGOMAN_KEYSTORE: file
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
      MODEL: ${{ inputs.model || github.event.client_payload.model || 'free/coder' }}
      PACKS: ${{ inputs.packs || github.event.client_payload.packs }}
      VARIANT: ${{ inputs.variant || github.event.client_payload.variant }}
      # A push that changes this workflow or the script runs a cheap smoke run
      # instead of the full set: one case per pack, ten minutes each.
      CASES: ${{ inputs.cases || github.event.client_payload.cases || (github.event_name == 'push' && '1' || '') }}
      CASE_TIMEOUT: ${{ inputs.case_timeout || github.event.client_payload.case_timeout || '900' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tools
        run: |
          pip install pandas pillow python-pptx python-docx pypdf playwright
          python -m playwright install --with-deps chromium
          npm install -g opencode-ai
      - name: Set up MangoMan
        run: |
          export MANGOMAN_HOME="$RUNNER_TEMP/mangoman"
          echo "MANGOMAN_HOME=$MANGOMAN_HOME" >> "$GITHUB_ENV"
          go run ./cmd/mangoman init > /dev/null
      - name: Run the packs
        timeout-minutes: 160
        run: |
          set +e
          scripts/pack-run.sh "$MODEL" $PACKS 2>&1 | tee report.md
          status=${PIPESTATUS[0]}
          {
            echo "## Pack run: $MODEL${VARIANT:+ (instructions: $VARIANT)}"
            grep '^|' report.md
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$status" = 0 ] || echo "::warning::some cases scored below 50; see the summary"
          exit 0
      - name: Record what the run cost
        if: always()
        run: go run ./cmd/mangoman usage --days 1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish the report to the eval-reports branch
        if: always()
        run: |
          [ -s report.md ] || exit 0
          stamp=$(date -u +%Y%m%d-%H%M%S)
          git config user.name "mangoman-eval"
          git config user.email "eval@users.noreply.github.com"
          git fetch origin +refs/heads/eval-reports:refs/remotes/origin/eval-reports 2>/dev/null || true
          if git show-ref --quiet refs/remotes/origin/eval-reports; then
            git worktree add ../reports origin/eval-reports
            (cd ../reports && git switch -C eval-reports)
          else
            git worktree add --detach ../reports
            (cd ../reports && git switch --orphan eval-reports)
          fi
          out="../reports/reports/pack-run/$stamp"
          mkdir -p "$out"
          cp report.md "$out/"
          cp -r pack-run-logs "$out/logs" 2>/dev/null || true
          cp "$MANGOMAN_HOME/serve.log" "$out/" 2>/dev/null || true
          go run ./cmd/mangoman usage --json --days 1 > "$out/usage.json" || true
          # The branch is public: blank out any key a log may have caught.
          python3 - "$out" <<'PY'
          import os, pathlib, sys
          keys = [os.environ.get(k, "") for k in ("GROQ_API_KEY", "CEREBRAS_API_KEY",
                  "OPENROUTER_API_KEY", "NVIDIA_API_KEY", "OPENCODE_ZEN_API_KEY")]
          keys = [k for k in keys if len(k) >= 8]
          for f in pathlib.Path(sys.argv[1]).rglob("*"):
              if not f.is_file():
                  continue
              text = f.read_bytes().decode("utf-8", "replace")
              clean = text
              for k in keys:
                  clean = clean.replace(k, "[key hidden]")
              if clean != text:
                  f.write_text(clean)
          PY
          cd ../reports
          git add -A
          git commit -q -m "pack run $MODEL${VARIANT:+ ($VARIANT)} $stamp (run ${{ github.run_id }})" || exit 0
          git push origin eval-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack-run-report
          path: report.md
          if-no-files-found: ignore
