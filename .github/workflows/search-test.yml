name: search-test

# Tests the web search the coding helper uses (Exa, and Parallel to compare)
# with free NVIDIA models: from memory, with Exa results, with Parallel
# results. About 300 free-tier requests and 20 minutes. Run it by hand, never
# on a schedule. The report goes to the eval-reports branch.
# A session starts it with POST /repos/<owner>/<repo>/dispatches, event_type search-test.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [search-test]

permissions:
  contents: write # only to publish the report to the eval-reports branch

concurrency:
  group: search-test
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run the test
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python3 scripts/search-test.py
      - name: Publish the report to the eval-reports branch
        if: always()
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          [ -s report.md ] || exit 0
          mkdir out && mv report.md out/ && python3 scripts/mask-keys.py out
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          stamp=$(date -u +%Y%m%d-%H%M%S)
          git config user.name "mangoman-eval"
          git config user.email "eval@users.noreply.github.com"
          git fetch origin +refs/heads/eval-reports:refs/remotes/origin/eval-reports
          git worktree add ../reports origin/eval-reports
          cd ../reports
          git switch -C eval-reports
          mkdir -p reports/search-test
          cp "$GITHUB_WORKSPACE/out/report.md" "reports/search-test/$stamp.md"
          git add -A
          git commit -q -m "search test $stamp (run ${{ github.run_id }})" || exit 0
          git push origin eval-reports
